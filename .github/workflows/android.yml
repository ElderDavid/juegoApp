# Compila y prueba cada cambio en GitHub, para no depender de un ordenador concreto.
# No usa secretos: la app se compila sin Supabase ni AdMob reales (modo local + anuncios de prueba).
name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Pruebas de la lógica del juego
        run: ./gradlew :core:test --console=plain

      - name: Pruebas de la app, lint y APK de depuración
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain

      - name: Resumen de lint
        if: always()
        run: |
          python3 - <<'PY'
          import collections, json, pathlib
          p = pathlib.Path("app/build/reports/lint-results-debug.sarif")
          if not p.exists():
              raise SystemExit("Sin informe de lint")
          runs = json.loads(p.read_text())["runs"]
          c = collections.Counter((r.get("level", "warning"), r["ruleId"]) for run in runs for r in run.get("results", []))
          print(f"Lint: {sum(c.values())} avisos")
          for (level, rule), n in sorted(c.items()):
              print(f"  {level:8} {rule}: {n}")
          for run in runs:
              for r in run.get("results", []):
                  loc = r.get("locations", [{}])[0].get("physicalLocation", {})
                  where = loc.get("artifactLocation", {}).get("uri", "?")
                  line = loc.get("region", {}).get("startLine", "")
                  print(f"- {r['ruleId']} {where}:{line} {r['message']['text']}")
          PY

      # Compila la release (sin firmar) para comprobar que R8 no rompe nada al reducir el código.
      - name: Compilación release con R8 (APK y AAB sin firmar)
        run: ./gradlew :app:assembleRelease :app:bundleRelease --console=plain

      - name: Resultados de pruebas y lint
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: informes
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: APK de depuración
        uses: actions/upload-artifact@v6
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

  servidor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Pruebas SQL de perfiles, salas y clasificación
        env:
          PGTEST_DSN: "host=localhost port=5432 user=postgres password=postgres"
        run: |
          pip install psycopg2-binary
          python supabase/tests/salas_test.py
