# Genera capturas de las pantallas principales en la JVM (Robolectric), sin emulador,
# para revisar cambios de diseño. Las imágenes quedan como artefacto «capturas».
name: Capturas

on:
  pull_request:
    paths:
      - "app/src/main/kotlin/com/elderdavid/quientienelarazon/ui/**"
      - "app/src/main/res/**"
      - "app/src/test/kotlin/com/elderdavid/quientienelarazon/ui/**"
  workflow_dispatch:

concurrency:
  group: capturas-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  capturas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v5

      - name: Capturas de pantalla
        run: ./gradlew :app:testDebugUnitTest -Pcapturas --console=plain

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: capturas
          path: |
            app/build/capturas/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
